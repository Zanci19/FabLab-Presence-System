; =============================================================================
; FabLab Presence System — ESP32-S3 PlatformIO Project
; Target board: Sunton ESP32-8048S043 (ESP32-S3, 4.3" IPS 800×480, GT911 touch)
; =============================================================================

[env:fablab_esp32s3]
platform                  = espressif32
board                     = esp32-s3-devkitc-1
framework                 = arduino

; 16 MB flash, OPI PSRAM (8 MB)
board_build.flash_size    = 16MB
board_build.partitions    = partitions.csv
board_build.flash_mode    = qio
board_build.psram_type    = opi
; Required for ESP32-S3 OPI PSRAM: tells the Arduino framework to initialise
; PSRAM in octal mode. Without this the bootloader gets 0xFFFFFF on the PSRAM
; ID read and the LCD frame-buffer allocation fails with ESP_ERR_NO_MEM.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size   = 16MB

; Use LittleFS for data partition
board_build.filesystem    = littlefs

; Upload / monitor
upload_speed              = 921600
monitor_speed             = 115200
monitor_filters           = esp32_exception_decoder

; scripts/copy_lv_conf.py runs before every build and places lv_conf.h
; next to the lvgl libdeps folder so lv_conf_internal.h finds it via
; its reliable "../../lv_conf.h" fallback.  This avoids the Xtensa GCC 8.x
; __has_include silent-failure bug that breaks the LV_CONF_INCLUDE_SIMPLE
; approach and prevents Montserrat font symbols from being linked.
extra_scripts = pre:scripts/copy_lv_conf.py

build_flags =
    ; PSRAM support
    -DBOARD_HAS_PSRAM
    ; NOTE: -mfix-esp32-psram-cache-issue is an ESP32 (LX6) silicon errata flag
    ; and must NOT be used on ESP32-S3 (LX7). It has been removed.
    ; Increase Arduino loop task stack (LVGL + networking)
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Optimise for speed
    -O2

lib_deps =
    ; LVGL 8.3 — stable release with wide ESP32 community support
    lvgl/lvgl @ ^8.3.11
    ; JSON serialisation
    bblanchon/ArduinoJson @ ^7.2.0
    ; Async HTTP + WebSocket server
    esphome/AsyncTCP-esphome @ ^2.1.4
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    ; NFC reader (MFRC522 via SPI)
    miguelbalboa/MFRC522 @ ^1.4.11
    ; NTP time client
    arduino-libraries/NTPClient @ ^3.2.1

lib_ldf_mode = deep
